<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Generate random colors with JustFlip, a small color exploration tool.">
  <title>JustFlip | Random colors</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="script.js"></script>
</head>
<body id="body">
  <main id="flipper">
    <h1>JustFlip</h1>
    <p id="color-status" role="status" aria-live="polite" aria-atomic="true">Current color: <span id="color-value">#FFFFFF</span></p>
    <div class="actions">
      <button type="button" id="flip-Btn">Flip color</button>
      <button type="button" id="copy-Btn">Copy hex</button>
    </div>
    <p id="copy-status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
